name: Perplexity PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: perplexity-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are withheld from a pull request opened from a fork, so the review
    # would have no key to work with.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The review diffs against the merge base, which is not in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Review the pull request
        run: node .github/scripts/perplexity-review.mjs
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
